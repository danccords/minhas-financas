<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f6f54">
<title>Minhas Finanças</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4ef; --card:#fff; --ink:#1c1c1a; --muted:#6c6b65; --line:#e7e5dd; --soft:#f1f0ea;
  --accent:#1f6f54; --accent-ink:#fff; --accent-soft:#e2f0e9;
  --red:#b23b2e; --red-soft:#fbe9e6; --amber:#a9640f;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141412; --card:#1e1e1b; --ink:#efeee8; --muted:#a3a29a; --line:#31312d; --soft:#262623;
    --accent:#52b48d; --accent-ink:#0b1d15; --accent-soft:#1b3328; --red:#ee8173; --red-soft:#3a1f1b; --amber:#f0b062; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right)) 90px max(14px,env(safe-area-inset-left))}
.sticky{position:sticky;top:0;z-index:10;background:var(--bg);margin:-16px -14px 0;padding:12px 14px 8px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.sticky .monthnav{margin:10px 0 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font-size:20px;margin:0;letter-spacing:-.01em}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{background:none;border:0;padding:6px 14px;border-radius:999px;font:inherit;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.monthnav{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px 0 6px}
.monthnav b{font-size:18px;min-width:170px;text-align:center}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat span{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.neg b{color:var(--red)} .stat.pos b{color:var(--accent)}
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} }
.cta{display:flex;gap:8px;margin:6px 0 4px}
.cta label,.cta button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 10px;font-weight:600;cursor:pointer;font:inherit;font-weight:600}
.cta label{background:var(--accent);color:var(--accent-ink)}
.cta button{background:var(--accent);border:0;color:var(--accent-ink)}
.cta svg{width:20px;height:20px}
input[type=file]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;overflow:hidden}
.card>header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none}
.card>header h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
.card>header .tot{font-weight:700;font-variant-numeric:tabular-nums}
.card>header .chev{color:var(--muted);transition:.15s;margin-left:6px}
.card.closed>header .chev{transform:rotate(-90deg)}
.card.closed .body{display:none}
.count{font-size:12px;color:var(--muted);font-weight:500}
.body{border-top:1px solid var(--line)}
.it{display:grid;grid-template-columns:1fr auto;gap:1px 10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:0}
.it:hover{background:var(--soft)}
.it .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.it .m{grid-column:1/-1;color:var(--muted);font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.gray{background:var(--soft);color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:6px}
.tick{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;background:var(--card)}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.it.fixo{grid-template-columns:auto 1fr auto}
.it.fixo .m{grid-column:2/-1}
.it.fixo .tick{grid-row:1/3;align-self:center}
.empty{padding:16px 14px;color:var(--muted);font-size:13.5px}
.foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:13.5px;border-radius:10px;padding:8px 13px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}
.btn:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 14px;text-align:right;border-bottom:1px solid var(--line);font-size:13.5px}
th{color:var(--muted);font-weight:600;font-size:12px}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
@media (max-width:480px){ th,td{padding:7px 8px;font-size:12.5px} th:first-child,td:first-child{padding-left:12px} th:last-child,td:last-child{padding-right:12px} }
td.over{color:var(--red);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar i.over{background:var(--red)}
.yearbars{display:flex;align-items:flex-end;gap:6px;height:150px;padding:14px 14px 4px}
.yb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.yb .cols{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.yb .cols i{width:42%;border-radius:3px 3px 0 0;min-height:1px}
.yb .g{background:var(--red)} .yb .e{background:var(--accent)}
.yb small{font-size:10.5px;color:var(--muted)}
.legend{display:flex;gap:14px;padding:0 14px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media (min-width:640px){ .ov{align-items:center} }
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 20px}
@media (min-width:640px){ .sheet{border-radius:18px} }
.sheet h3{margin:0 0 12px;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .full{grid-column:1/-1}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:3px}
.sheet input,.sheet select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.grid2>div{min-width:0}
.sheet input,.sheet select{min-width:0;max-width:100%;height:42px;-webkit-appearance:none;appearance:none}
.sheet input[type=checkbox]{height:auto;-webkit-appearance:checkbox;appearance:auto}
.sheet input[type=date]{display:block;line-height:24px}
.sheet input[type=date]::-webkit-date-and-time-value{text-align:left}
.sheet select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sheethead h3{margin:0}
.kbbtn{display:none;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
body.kb .kbbtn{display:inline-block}
.hint{font-size:12px;color:var(--accent);margin-top:4px}
.sheet input:focus,.sheet select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:var(--soft);margin-bottom:12px}
.items{font-size:12.5px;color:var(--muted);white-space:pre-line;margin-top:10px;max-height:90px;overflow:auto;background:var(--soft);padding:8px 10px;border-radius:9px}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts .sp{flex:1}
.loading{display:flex;align-items:center;gap:12px;color:var(--muted);padding:6px 0}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
.err{color:var(--amber);background:var(--red-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hidden{display:none!important}
.status{text-align:center;color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="sticky">
  <div class="top">
    <h1>Minhas Finanças</h1>
    <div class="seg"><button data-view="mes" class="on">Mês</button><button data-view="ano">Ano</button></div>
  </div>

  <div class="monthnav">
    <button class="iconbtn" id="prev" aria-label="anterior">‹</button>
    <b id="label">…</b>
    <button class="iconbtn" id="next" aria-label="próximo">›</button>
  </div>
  </div>

  <div id="err" class="err hidden"></div>
  <div id="main"><div class="status">Carregando…</div></div>
</div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= constantes ================= */
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const TIPOS=["DÉBITO","NUBANK","MERCADO PAGO","C6","Crédito 4"];
const CATS=["Mercado","Necessidades","Lazer","Saúde","Presentes","IFood/restaurante","Uber/transporte","Beleza","Roupa","Eletrônicos","Assinaturas","Despesas eventuais","Desenvolvimento","Combustivel","Contas","Aluguel"];
const BLOCOS={gasto:"Gastos do mês",fixo:"Fixos",parcela:"Cartão de crédito parcelado",entrada:"Entradas",invest:"Investimentos"};
const GASTO_BLOCOS=["gasto","fixo","parcela"];

/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pct=v=>isFinite(v)?(v*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%":"–";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const ddmm=iso=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)}`:"";
const mkLabel=mk=>`${MESES[+mk.slice(5,7)-1]} ${mk.slice(0,4)}`;
const shift=(mk,n)=>{let y=+mk.slice(0,4),m=+mk.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return `${y}-${String(m+1).padStart(2,"0")}`};
const parseBRL=s=>{s=String(s).trim().replace(/[R$\s]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return parseFloat(s)};
const sum=(arr)=>arr.reduce((a,x)=>a+(Number(x.valor)||0),0);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)}
function showErr(m){const e=$("#err");if(!m){e.classList.add("hidden");return}e.textContent=m;e.classList.remove("hidden")}
function lsGet(k,d){try{return localStorage.getItem(k)??d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch{}}

/* ================= estado ================= */
let db=null,itens=null;
let view="mes";
let cur=todayISO().slice(0,7);
let items=[],mesDoc={},config={orcamento:{}};
let unsubItems=null,unsubMes=null,loaded=false,loadTimer=null;
const closed=new Set(JSON.parse(lsGet("fechados","[]")));

/* ================= armazenamento local (fora do Claude) ================= */
const LS_KEY="minhas-financas-v1";
const IN_CLAUDE=!!(window.claude&&window.claude.use);
let modoLocal=false;
function localDb(){
  let store={};try{store=JSON.parse(localStorage.getItem(LS_KEY)||"{}")||{}}catch{store={}}
  const subs=new Set();
  const save=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(store))}catch(e){showErr("Não consegui salvar no aparelho. O armazenamento pode estar cheio.")}};
  const changed=()=>{save();subs.forEach(f=>{try{f()}catch(e){console.error(e)}})};
  const snap=(p)=>({id:p.split("/").pop(),exists:p in store,data:()=>store[p],metadata:{fromCache:false,hasPendingWrites:false}});
  const newId=()=>"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const docRef=p=>({id:p.split("/").pop(),path:p,
    get:async()=>snap(p),
    set:async d=>{store[p]=JSON.parse(JSON.stringify(d));changed()},
    update:async d=>{if(!(p in store))throw{code:"invalid_argument",message:"não existe"};store[p]={...store[p],...JSON.parse(JSON.stringify(d))};changed()},
    delete:async()=>{delete store[p];changed()},
    onSnapshot(n){const f=()=>n(snap(p));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}});
  const query=(col,filters=[],lim=0)=>{
    const depth=col.split("/").length+1;
    const run=()=>{let r=Object.keys(store).filter(k=>k.startsWith(col+"/")&&k.split("/").length===depth).map(snap)
      .filter(sn=>filters.every(([f,op,v])=>{const x=sn.data()[f];return op==="=="?x===v:op===">="?x>=v:op==="<="?x<=v:op===">"?x>v:op==="<"?x<v:op==="!="?x!==v:true}));
      if(lim)r=r.slice(0,lim);return {docs:r,size:r.length,empty:!r.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}};
    return {where:(f,op,v)=>query(col,[...filters,[f,op,v]],lim),limit:n=>query(col,filters,n),orderBy:()=>query(col,filters,lim),
      get:async()=>run(),
      onSnapshot(n){const f=()=>n(run());subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},
      doc:id=>docRef(col+"/"+(id||newId())),
      add:async d=>{const r=docRef(col+"/"+newId());await r.set(d);return r}};
  };
  return {doc:docRef,collection:c=>query(c),_dump:()=>store,_load:o=>{store=o;changed()}};
}

/* ================= backup ================= */
function baixarBackup(){
  const data={app:"minhas-financas",versao:1,geradoEm:new Date().toISOString(),docs:db._dump()};
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`financas-backup-${todayISO()}.json`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  lsSet("minhas-financas-ultimo-backup",todayISO());
  toast("Backup baixado");render();
}
function restaurarBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||o.app!=="minhas-financas"||typeof o.docs!=="object")throw 0;
      const n=Object.keys(o.docs).filter(k=>k.startsWith("itens/")).length;
      $("#modal").innerHTML=`<div class="ov"><div class="sheet"><h3>Restaurar backup?</h3>
        <p style="color:var(--muted);font-size:14px">O arquivo tem <b>${n}</b> lançamentos. Os dados atuais deste aparelho serão <b>substituídos</b> por ele.</p>
        <div class="acts"><span class="sp"></span><button class="btn" id="rC">Cancelar</button><button class="btn primary" id="rS">Restaurar</button></div></div></div>`;
      $("#rC").onclick=()=>$("#modal").innerHTML="";
      $("#rS").onclick=()=>{db._load(o.docs);$("#modal").innerHTML="";toast(`${n} lançamentos restaurados`);if(view==="ano")loadYear()};
    }catch{toast("Esse arquivo não é um backup do Minhas Finanças.")}
  };
  r.readAsText(file);
}

/* ================= dados iniciais criptografados ================= */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decifrar(pkg,senha){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64(pkg.salt),iterations:pkg.it},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(pkg.iv)},key,b64(pkg.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function ofertarDadosIniciais(){
  if(!modoLocal)return;
  const temDados=Object.keys(db._dump()).some(k=>k.startsWith("itens/"));
  if(temDados||lsGet("minhas-financas-sem-carga","")==="1"||!(window.crypto&&crypto.subtle))return;
  let pkg;try{const r=await fetch("dados-iniciais.json",{cache:"no-store"});if(!r.ok)return;pkg=await r.json()}catch{return}
  $("#modal").innerHTML=`<div class="ov"><div class="sheet"><div class="sheethead"><h3>Carregar seus dados</h3><button type="button" class="kbbtn">⌄ Recolher teclado</button></div>
    <p style="margin:0 0 12px;color:var(--muted);font-size:14px">Seus lançamentos estão guardados com senha. Digite a senha para carregar tudo neste aparelho.</p>
    <label class="f">Senha</label><input id="sPw" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="palavra-palavra-palavra-palavra-00">
    <div id="sErr" class="hint" style="color:var(--red)"></div>
    <div class="acts"><button class="btn" id="sSkip">Começar vazio</button><span class="sp"></span><button class="btn primary" id="sGo">Carregar</button></div></div></div>`;
  const go=async()=>{
    const pw=$("#sPw").value.trim().toLowerCase(); if(!pw)return;
    $("#sGo").disabled=true;$("#sGo").textContent="Abrindo…";$("#sErr").textContent="";
    try{
      const o=await decifrar(pkg,pw);
      if(!o||o.app!=="minhas-financas")throw 0;
      db._load(o.docs);$("#modal").innerHTML="";
      toast(`${Object.keys(o.docs).filter(k=>k.startsWith("itens/")).length} lançamentos carregados`);
    }catch{$("#sGo").disabled=false;$("#sGo").textContent="Carregar";$("#sErr").textContent="Senha incorreta. Confira e tente de novo."}
  };
  $("#sGo").onclick=go;
  $("#sPw").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.stopPropagation();go()}},true);
  $("#sSkip").onclick=()=>{lsSet("minhas-financas-sem-carga","1");$("#modal").innerHTML=""};
}

(async()=>{
  if(IN_CLAUDE){try{db=await claude.use("db")}catch{}}
  if(!db){db=localDb();modoLocal=true;setTimeout(ofertarDadosIniciais,0)}
  itens=db.collection("itens");
  db.doc("config/geral").onSnapshot(s=>{config=s.exists?{orcamento:{},...s.data()}:{orcamento:{}};render()},()=>{});
  subscribe();
})();

function subscribe(){
  if(unsubItems)unsubItems(); if(unsubMes)unsubMes();
  loaded=false; items=[]; render();
  clearTimeout(loadTimer);
  loadTimer=setTimeout(()=>{if(!loaded)showErr("Os dados estão demorando para carregar. Verifique sua conexão.")},10000);
  const mk=cur;
  unsubItems=itens.where("mes","==",mk).onSnapshot(s=>{
    if(mk!==cur)return;
    items=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!s.metadata.fromCache){loaded=true;clearTimeout(loadTimer);showErr("")}
    else if(items.length) loaded=true;
    render();
  },e=>{clearTimeout(loadTimer);showErr("Erro ao carregar ("+e.code+").")});
  unsubMes=db.doc("meses/"+mk).onSnapshot(s=>{if(mk!==cur)return;mesDoc=s.exists?s.data():{};render()},()=>{});
}

/* ================= teclado ================= */
const isField=el=>el&&(el.tagName==="INPUT"&&!["checkbox","radio","button"].includes(el.type)||el.tagName==="TEXTAREA");
document.addEventListener("focusin",e=>{if(isField(e.target))document.body.classList.add("kb")});
document.addEventListener("focusout",()=>setTimeout(()=>{if(!isField(document.activeElement))document.body.classList.remove("kb")},50));
// tocar fora de um campo recolhe o teclado
document.addEventListener("pointerdown",e=>{const a=document.activeElement;if(isField(a)&&!isField(e.target)&&!e.target.closest("select"))a.blur()});
document.addEventListener("click",e=>{if(e.target.closest(".kbbtn")){e.preventDefault();const a=document.activeElement;if(a&&a.blur)a.blur();document.body.classList.remove("kb")}});
// "OK/Concluído" do teclado também recolhe
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&isField(e.target)){e.preventDefault();e.target.blur()}});

/* ================= navegação ================= */
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));
  view=b.dataset.view; render(); if(view==="ano")loadYear();
});
$("#prev").onclick=()=>move(-1);
$("#next").onclick=()=>move(1);
function move(n){
  if(view==="ano"){cur=shift(cur,12*n);loadYear();render();return}
  cur=shift(cur,n);subscribe();
}

/* ================= render do mês ================= */
function byBloco(b){return items.filter(x=>x.bloco===b).sort((a,c)=>(a.data||"9").localeCompare(c.data||"9")||(a.ordem||0)-(c.ordem||0))}
function render(){
  $("#label").textContent=view==="ano"?cur.slice(0,4):mkLabel(cur);
  if(view==="ano"){renderYear();return}
  if(!db)return;
  if(!loaded&&!items.length){$("#main").innerHTML='<div class="status">Carregando…</div>';return}
  const g=byBloco("gasto"),f=byBloco("fixo"),p=byBloco("parcela"),en=byBloco("entrada"),iv=byBloco("invest");
  const totG=sum(g),totF=sum(f),totP=sum(p),total=totG+totF+totP,totE=sum(en),totI=sum(iv),saldo=totE-total;
  const gastosAll=[...g,...f,...p];

  let h=`
  <div class="stats">
    <div class="stat"><span>Entradas</span><b>${brl(totE)}</b></div>
    <div class="stat"><span>Gastos</span><b>${brl(total)}</b></div>
    <div class="stat ${saldo<0?"neg":"pos"}"><span>Saldo</span><b>${brl(saldo)}</b></div>
    <div class="stat"><span>Investido</span><b>${brl(totI)}</b></div>
  </div>
  <div class="cta">
    <button id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Novo lançamento</button>
  </div>`;

  h+=section("gasto","Gastos do mês",g,totG,it=>row(it));
  h+=section("fixo","Fixos",f,totF,it=>rowFixo(it),
      f.length?"":`<button class="btn" data-copy="fixo">Copiar fixos de ${MESES[+shift(cur,-1).slice(5,7)-1]}</button>`);
  h+=section("parcela","Cartão de crédito parcelado",p,totP,it=>row(it,it.parcelas),
      p.length?"":`<button class="btn" data-copy="parcela">Trazer parcelas de ${MESES[+shift(cur,-1).slice(5,7)-1]}</button>`);
  h+=section("entrada","Entradas",en,totE,it=>row(it,null,true));
  h+=section("invest","Investimentos",iv,totI,it=>row(it,null,true));

  // por categoria
  const orc=config.orcamento||{};
  const cats=CATS.map(c=>({c,esp:Number(orc[c])||0,v:sum(gastosAll.filter(x=>x.categoria===c))})).filter(x=>x.v||x.esp);
  const semCat=sum(gastosAll.filter(x=>!CATS.includes(x.categoria)));
  h+=`<section class="card ${closed.has("cat")?"closed":""}" data-sec="cat"><header><h2>Gastos por categoria</h2><span><span class="tot">${brl(total)}</span><span class="chev">▾</span></span></header><div class="body">
    <div class="tw"><table><tr><th>Categoria</th><th>Esperado</th><th>Gasto</th><th>%</th></tr>
    ${cats.sort((a,b)=>b.v-a.v).map(x=>{const over=x.esp&&x.v>x.esp;return `<tr><td>${esc(x.c)}<div class="bar"><i class="${over?"over":""}" style="width:${Math.min(100,x.esp?x.v/x.esp*100:total?x.v/total*100:0)}%"></i></div></td><td>${x.esp?brl(x.esp):"–"}</td><td class="${over?"over":""}">${brl(x.v)}</td><td>${pct(total?x.v/total:0)}</td></tr>`}).join("")}
    ${semCat?`<tr><td>Sem categoria</td><td>–</td><td>${brl(semCat)}</td><td>${pct(semCat/total)}</td></tr>`:""}
    </table></div><div class="foot"><button class="btn" id="orcBtn">Definir valores esperados</button></div></div></section>`;

  // por tipo de pagamento
  const pagos=mesDoc.pagos||{};
  const tipos=TIPOS.map(t=>({t,v:sum(gastosAll.filter(x=>x.tipo===t))})).filter(x=>x.v||x.t!=="Crédito 4");
  h+=`<section class="card ${closed.has("tipo")?"closed":""}" data-sec="tipo"><header><h2>Por tipo de pagamento</h2><span class="chev">▾</span></header><div class="body">
    <table><tr><th>Tipo</th><th>Total</th><th>Pago?</th></tr>
    ${tipos.map(x=>`<tr><td>${esc(x.t)}</td><td>${brl(x.v)}</td><td><span class="tick ${pagos[x.t]?"on":""}" data-pago="${esc(x.t)}">${pagos[x.t]?"✓":""}</span></td></tr>`).join("")}
    </table><div class="foot"><button class="btn" id="fechBtn">Dias de fechamento dos cartões</button></div></div></section>`;

  $("#main").innerHTML=h;
  bindMonth();
}
function section(b,title,list,tot,rowFn,extra=""){
  return `<section class="card ${closed.has(b)?"closed":""}" data-sec="${b}">
    <header><h2>${title} <span class="count">${list.length||""}</span></h2><span><span class="tot">${brl(tot)}</span><span class="chev">▾</span></span></header>
    <div class="body">${list.length?list.map(rowFn).join(""):`<div class="empty">Nada lançado.</div>`}
    <div class="foot">${extra}<button class="btn" data-add="${b}">+ Adicionar</button></div></div></section>`;
}
function row(it,extra,simple){
  return `<div class="it" data-id="${it.id}"><div class="n">${esc(it.nome||"(sem nome)")}</div><div class="v">${brl(it.valor)}</div>
    ${simple?"":`<div class="m">${it.data?ddmm(it.data)+" ·":""} ${esc(it.tipo)} ${it.categoria?`<span class="chip">${esc(it.categoria)}</span>`:""} ${extra?`<span class="chip gray">${esc(extra)}</span>`:""}</div>`}</div>`;
}
function rowFixo(it){
  return `<div class="it fixo" data-id="${it.id}"><span class="tick ${it.pago?"on":""}" data-tick="${it.id}">${it.pago?"✓":""}</span><div class="n">${esc(it.nome)}</div><div class="v">${brl(it.valor)}</div>
    <div class="m">${it.data?"dia "+it.data.slice(8,10)+" ·":""} ${esc(it.tipo)} ${it.categoria?`<span class="chip">${esc(it.categoria)}</span>`:""} ${it.pago?'<span class="chip">pago</span>':""}</div></div>`;
}
function bindMonth(){
  document.querySelectorAll(".card>header").forEach(h=>h.onclick=()=>{const s=h.parentElement,k=s.dataset.sec;s.classList.toggle("closed");s.classList.contains("closed")?closed.add(k):closed.delete(k);lsSet("fechados",JSON.stringify([...closed]))});
  document.querySelectorAll(".it[data-id]").forEach(el=>el.onclick=e=>{if(e.target.closest("[data-tick]"))return;const it=items.find(x=>x.id===el.dataset.id);if(it)openEditor({...it})});
  document.querySelectorAll("[data-tick]").forEach(el=>el.onclick=async e=>{e.stopPropagation();const it=items.find(x=>x.id===el.dataset.tick);if(!it)return;try{await itens.doc(it.id).update({pago:!it.pago})}catch(er){showErr("Não consegui salvar ("+(er.code||er)+").")}});
  document.querySelectorAll("[data-add]").forEach(el=>el.onclick=()=>openEditor(blank(el.dataset.add)));
  document.querySelectorAll("[data-copy]").forEach(el=>el.onclick=()=>copyPrev(el.dataset.copy,el));
  document.querySelectorAll("[data-pago]").forEach(el=>el.onclick=async()=>{const t=el.dataset.pago;const pagos={...(mesDoc.pagos||{})};pagos[t]=!pagos[t];try{await db.doc("meses/"+cur).set({...mesDoc,pagos})}catch(er){showErr("Não consegui salvar ("+(er.code||er)+").")}});
  $("#addBtn").onclick=()=>openEditor(blank("gasto"));
  $("#orcBtn").onclick=openOrcamento;
  $("#fechBtn").onclick=openFechamento;
}
function blank(b){
  const d=cur===todayISO().slice(0,7)?todayISO():cur+"-01";
  return {bloco:b,nome:"",data:(b==="entrada"||b==="invest")?"":d,tipo:b==="gasto"?lsGet("ultimoTipo","DÉBITO"):"NUBANK",categoria:"",valor:"",pago:false,parcelas:"",nParc:2,modo:"total"};
}

/* ================= copiar do mês anterior ================= */
async function copyPrev(b,btn){
  btn.disabled=true;
  try{
    const prev=shift(cur,-1);
    const s=await itens.where("mes","==",prev).get();
    let list=s.docs.map(d=>d.data()).filter(x=>x.bloco===b);
    if(!list.length){toast(`Não há ${b==="fixo"?"fixos":"parcelas"} em ${mkLabel(prev)}.`);btn.disabled=false;return}
    let n=0;
    for(const x of list){
      const nx={...x,mes:cur,ordem:Date.now()+n};
      if(b==="fixo"){nx.pago=false;if(x.data){const day=Math.min(+x.data.slice(8,10),28);nx.data=`${cur}-${String(day).padStart(2,"0")}`}}
      if(b==="parcela"){
        const m=/^(\d+)\s*\/\s*(\d+)$/.exec(x.parcelas||"");
        if(m){const a=+m[1],t=+m[2];if(a>=t)continue;nx.parcelas=`${a+1}/${t}`}
        nx.data="";
      }
      await itens.add(nx); n++;
    }
    toast(`${n} item(ns) copiado(s).`);
  }catch(e){showErr("Não consegui copiar ("+(e.code||e)+").");btn.disabled=false}
}

/* ================= editor ================= */
function openEditor(it,thumb){
  const isNew=!it.id;
  const opts=(arr,v,emptyLabel)=>(emptyLabel?`<option value="">${emptyLabel}</option>`:"")+arr.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("");
  const b=it.bloco;
  const startMes=it.mes||cur;
  $("#modal").innerHTML=`<div class="ov"><div class="sheet">
    <div class="sheethead"><h3>${isNew?(thumb?"Confira o que eu li":"Novo lançamento"):"Editar lançamento"}</h3><button type="button" class="kbbtn">⌄ Recolher teclado</button></div>
    ${thumb?`<img class="thumb" src="${thumb}" alt="comprovante">`:""}
    <div class="grid2">
      <div class="full"><label class="f">Onde lançar</label><select id="eB">${Object.entries(BLOCOS).map(([k,v])=>`<option value="${k}"${k===b?" selected":""}>${v}</option>`).join("")}</select></div>
      <div class="full"><label class="f">Nome</label><input id="eN" enterkeyhint="done" value="${esc(it.nome)}" placeholder="Ex.: Troca de óleo"></div>
      <div class="full w-modo"><label class="f">Como você quer informar o valor?</label>
        <div class="seg" style="display:flex"><button type="button" data-modo="total" class="${it.modo==="parcela"?"":"on"}" style="flex:1">Valor total</button><button type="button" data-modo="parcela" class="${it.modo==="parcela"?"on":""}" style="flex:1">Valor da parcela (com juros)</button></div></div>
      <div class="w-data"><label class="f" id="lD">Data</label><input id="eD" type="date" value="${esc(it.data||"")}"></div>
      <div><label class="f" id="lV">Valor (R$)</label><input id="eV" enterkeyhint="done" inputmode="decimal" value="${it.valor===""||it.valor==null?"":Number(it.valor).toFixed(2).replace(".",",")}" placeholder="0,00"></div>
      <div class="w-n"><label class="f">Nº de parcelas</label><input id="eQ" enterkeyhint="done" type="number" min="2" max="48" inputmode="numeric" value="${it.nParc||2}"></div>
      <div class="w-ini"><label class="f">1ª parcela em</label><select id="eI">${Array.from({length:22},(_,i)=>shift(startMes,i-3)).map(m=>`<option value="${m}"${m===startMes?" selected":""}>${mkLabel(m)}</option>`).join("")}</select></div>
      <div class="full w-ini hint" id="eHint"></div>
      <div class="w-tipo"><label class="f">Tipo (pagamento)</label><select id="eT">${opts(TIPOS,it.tipo)}</select></div>
      <div class="w-cat"><label class="f">Categoria</label><select id="eC">${opts(CATS,it.categoria,"Escolha…")}</select></div>
      <div class="w-parc"><label class="f">Parcela (ex.: 2/10)</label><input id="eP" enterkeyhint="done" value="${esc(it.parcelas||"")}"></div>
      <div class="w-pago" style="display:flex;align-items:flex-end"><label class="chk"><input id="eG" type="checkbox" style="width:auto"${it.pago?" checked":""}> Já paguei</label></div>
      ${!isNew&&it.grupo?`<div class="full"><label class="chk"><input id="eAll" type="checkbox" style="width:auto"> Aplicar nome, valor, tipo e categoria às outras parcelas desta compra</label></div>`:""}
    </div>
    <div id="pPrev" class="items hidden"></div>
    ${it.itens?`<div class="items">${esc(it.itens)}</div>`:""}
    <div class="acts" id="eActs">
      ${isNew?"":`<button class="btn danger" id="eDel">Excluir</button>`}
      <span class="sp"></span>
      <button class="btn" id="eCancel">${thumb?"Descartar":"Cancelar"}</button>
      <button class="btn primary" id="eSave">Salvar</button>
    </div>
  </div></div>`;
  let modo=it.modo==="parcela"?"parcela":"total";
  const multi=()=>isNew&&$("#eB").value==="parcela";
  const plan=()=>{ // calcula as parcelas da compra nova
    const n=Math.max(2,Math.min(48,parseInt($("#eQ").value)||0)),v=parseBRL($("#eV").value);
    if(!(v>0)||!n)return null;
    let vals;
    if(modo==="total"){const base=Math.floor(v/n*100)/100;vals=Array.from({length:n},(_,i)=>i===n-1?Math.round((v-base*(n-1))*100)/100:base)}
    else vals=Array(n).fill(Math.round(v*100)/100);
    const ini=$("#eI").value||cur;
    return {n,vals,total:vals.reduce((a,x)=>a+x,0),ini,fim:shift(ini,n-1)};
  };
  const vis=()=>{const v=$("#eB").value,simple=v==="entrada"||v==="invest",m=multi();
    document.querySelector(".w-data").classList.toggle("hidden",simple);
    document.querySelector(".w-tipo").classList.toggle("hidden",simple);
    document.querySelector(".w-cat").classList.toggle("hidden",simple);
    document.querySelector(".w-parc").classList.toggle("hidden",v!=="parcela"||m);
    document.querySelector(".w-pago").classList.toggle("hidden",v!=="fixo");
    ["w-modo","w-n"].forEach(c=>document.querySelector("."+c).classList.toggle("hidden",!m));
    document.querySelectorAll(".w-ini").forEach(el=>el.classList.toggle("hidden",!m));
    $("#lD").textContent=v==="parcela"?"Data da compra":"Data";
    $("#lV").textContent=m?(modo==="total"?"Valor total (R$)":"Valor de cada parcela (R$)"):"Valor (R$)";
    const pv=$("#pPrev");
    if(m){const p=plan();pv.classList.remove("hidden");
      pv.textContent=p?`${p.n}x de ${brl(p.vals[0])}${p.vals[p.n-1]!==p.vals[0]?` (última ${brl(p.vals[p.n-1])})`:""} · total ${brl(p.total)}\nDe ${mkLabel(p.ini)} até ${mkLabel(p.fim)}`:"Preencha o valor e o número de parcelas."}
    else pv.classList.add("hidden");
  };
  let iniManual=false;
  const autoIni=()=>{
    if(!multi())return;
    const d=$("#eD").value,t=$("#eT").value,f=Number((config.fechamento||{})[t])||0,h=$("#eHint");
    if(!d||t==="DÉBITO"||!f){h.textContent=t!=="DÉBITO"&&!f?`Dica: informe o dia de fechamento do ${t} em "Por tipo de pagamento" que eu calculo o mês da 1ª parcela sozinho.`:"";return}
    const day=+d.slice(8,10),ini=day>=f?shift(d.slice(0,7),1):d.slice(0,7);
    h.textContent=`${t} fecha dia ${f}: compra em ${ddmm(d)} cai na fatura de ${mkLabel(ini)}.`;
    if(!iniManual){const sel=$("#eI");if(![...sel.options].some(o=>o.value===ini))sel.insertAdjacentHTML("beforeend",`<option value="${ini}">${mkLabel(ini)}</option>`);sel.value=ini}
  };
  vis(); autoIni(); $("#eB").onchange=()=>{vis();autoIni()};
  ["#eV","#eQ"].forEach(id=>$(id).oninput=vis);
  $("#eI").onchange=()=>{iniManual=true;vis()};
  $("#eD").onchange=()=>{autoIni();vis()}; $("#eT").onchange=()=>{autoIni();vis()};
  document.querySelectorAll("[data-modo]").forEach(bt=>bt.onclick=()=>{modo=bt.dataset.modo;document.querySelectorAll("[data-modo]").forEach(x=>x.classList.toggle("on",x===bt));vis()});
  const close=()=>{$("#modal").innerHTML=""};
  $("#eCancel").onclick=close;
  $(".ov").onclick=e=>{if(e.target.classList.contains("ov"))close()};
  if(!isNew)$("#eDel").onclick=async e=>{
    if(it.grupo){
      $("#eActs").innerHTML=`<span class="sp"></span><button class="btn" id="dOne">Só esta parcela</button><button class="btn danger" id="dAll">Todas as parcelas</button>`;
      $("#dOne").onclick=async()=>{try{await itens.doc(it.id).delete();toast("Parcela excluída");close()}catch(er){showErr("Não consegui excluir ("+(er.code||er)+").")}};
      $("#dAll").onclick=async()=>{try{const s=await itens.where("grupo","==",it.grupo).get();for(const d of s.docs)await itens.doc(d.id).delete();toast(`${s.docs.length} parcelas excluídas`);close()}catch(er){showErr("Não consegui excluir ("+(er.code||er)+").")}};
      return;
    }
    const btn=e.target; if(btn.dataset.c!=="1"){btn.dataset.c="1";btn.textContent="Confirmar exclusão";return}
    try{await itens.doc(it.id).delete();toast("Excluído");close()}catch(er){showErr("Não consegui excluir ("+(er.code||er)+").")}
  };
  $("#eSave").onclick=async()=>{
    const bl=$("#eB").value,simple=bl==="entrada"||bl==="invest";
    const nome=$("#eN").value.trim(),tipo=simple?"":$("#eT").value,categoria=simple?"":$("#eC").value,data=simple?"":$("#eD").value;
    if(!nome){toast("Preencha o nome.");return}
    // ---- compra parcelada nova: cria todas as parcelas ----
    if(multi()){
      const p=plan(); if(!p){toast("Informe o valor e o número de parcelas.");return}
      $("#eSave").disabled=true;
      const grupo="g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      try{
        for(let i=0;i<p.n;i++){
          await itens.add({bloco:"parcela",nome,tipo,categoria,data,valor:p.vals[i],parcelas:`${i+1}/${p.n}`,pago:false,
            mes:shift(p.ini,i),grupo,ordem:Date.now()+i,criadoEm:new Date().toISOString(),itensLidos:i===0?(it.itens||""):""});
        }
        lsSet("ultimoCredito",tipo);
        toast(`${p.n} parcelas lançadas até ${mkLabel(p.fim)}`); close();
      }catch(er){$("#eSave").disabled=false;showErr("Não consegui salvar todas as parcelas ("+(er.code||er)+"). Confira os meses seguintes.")}
      return;
    }
    const valor=parseBRL($("#eV").value);
    const rec={bloco:bl,nome,valor:Math.round(valor*100)/100,data,tipo,categoria,
      parcelas:bl==="parcela"?$("#eP").value.trim():"",pago:bl==="fixo"?$("#eG").checked:false};
    if(!(valor>0)){toast("Informe um valor maior que zero.");return}
    if(bl==="gasto"&&!rec.data){toast("Informe a data.");return}
    rec.mes = bl==="gasto" ? rec.data.slice(0,7) : (it.mes||cur);
    $("#eSave").disabled=true;
    try{
      if(isNew) await itens.add({...rec,ordem:Date.now(),itensLidos:it.itens||"",criadoEm:new Date().toISOString()});
      else{
        await itens.doc(it.id).update(rec);
        if(it.grupo&&$("#eAll")&&$("#eAll").checked){
          const s=await itens.where("grupo","==",it.grupo).get();
          for(const d of s.docs) if(d.id!==it.id) await itens.doc(d.id).update({nome:rec.nome,valor:rec.valor,tipo:rec.tipo,categoria:rec.categoria});
        }
      }
      if(bl==="gasto"){lsSet("ultimoTipo",rec.tipo);if(rec.tipo!=="DÉBITO")lsSet("ultimoCredito",rec.tipo)}
      toast(rec.mes!==cur?`Salvo em ${mkLabel(rec.mes)}`:"Salvo");
      close();
    }catch(er){$("#eSave").disabled=false;showErr(er.code==="quota_exceeded"?"O armazenamento está cheio.":"Não consegui salvar ("+(er.code||er)+").")}
  };
}

/* ================= fechamento dos cartões ================= */
function openFechamento(){
  const f=config.fechamento||{};
  const cards=TIPOS.filter(t=>t!=="DÉBITO");
  $("#modal").innerHTML=`<div class="ov"><div class="sheet"><div class="sheethead"><h3>Dia de fechamento</h3><button type="button" class="kbbtn">⌄ Recolher teclado</button></div>
    <p style="margin:-4px 0 12px;color:var(--muted);font-size:13px">Compras feitas a partir desse dia entram na fatura do mês seguinte. Uso isso para escolher o mês da 1ª parcela.</p>
    <div class="grid2">${cards.map((c,i)=>`<div><label class="f">${esc(c)}</label><input data-fch="${i}" type="number" min="1" max="31" inputmode="numeric" enterkeyhint="done" value="${f[c]||""}" placeholder="dia"></div>`).join("")}</div>
    <div class="acts"><span class="sp"></span><button class="btn" id="fC">Cancelar</button><button class="btn primary" id="fS">Salvar</button></div></div></div>`;
  $("#fC").onclick=()=>$("#modal").innerHTML="";
  $("#fS").onclick=async()=>{
    const o={};document.querySelectorAll("[data-fch]").forEach(el=>{const v=parseInt(el.value);if(v>=1&&v<=31)o[cards[+el.dataset.fch]]=v});
    try{await db.doc("config/geral").set({...config,fechamento:o});$("#modal").innerHTML="";toast("Fechamentos salvos")}catch(e){showErr("Não consegui salvar ("+(e.code||e)+").")}
  };
}

/* ================= orçamento ================= */
function openOrcamento(){
  const orc=config.orcamento||{};
  $("#modal").innerHTML=`<div class="ov"><div class="sheet"><div class="sheethead"><h3>Valor esperado por categoria</h3><button type="button" class="kbbtn">⌄ Recolher teclado</button></div>
    <p style="margin:-6px 0 12px;color:var(--muted);font-size:13px">Quanto você planeja gastar por mês em cada categoria. Vale para todos os meses.</p>
    <div class="grid2">${CATS.map((c,i)=>`<div><label class="f">${esc(c)}</label><input data-orc="${i}" enterkeyhint="done" inputmode="decimal" value="${orc[c]?Number(orc[c]).toFixed(2).replace(".",","):""}" placeholder="0,00"></div>`).join("")}</div>
    <div class="acts"><span class="sp"></span><button class="btn" id="oC">Cancelar</button><button class="btn primary" id="oS">Salvar</button></div></div></div>`;
  $("#oC").onclick=()=>$("#modal").innerHTML="";
  $("#oS").onclick=async()=>{
    const o={};document.querySelectorAll("[data-orc]").forEach(el=>{const v=parseBRL(el.value);if(v>0)o[CATS[+el.dataset.orc]]=Math.round(v*100)/100});
    try{await db.doc("config/geral").set({...config,orcamento:o});$("#modal").innerHTML="";toast("Valores salvos")}catch(e){showErr("Não consegui salvar ("+(e.code||e)+").")}
  };
}

/* ================= ano ================= */
let yearData=null,yearKey=null;
async function loadYear(){
  const y=cur.slice(0,4); yearKey=y; yearData=null; render();
  try{
    const s=await itens.where("mes",">=",y+"-01").where("mes","<=",y+"-12").limit(1000).get();
    if(yearKey!==y)return;
    yearData=s.docs.map(d=>({id:d.id,...d.data()})); render();
  }catch(e){showErr("Não consegui carregar o ano ("+(e.code||e)+").")}
}
function yearSummary(){
  const y=cur.slice(0,4);
  return MESES.map((n,i)=>{const mk=`${y}-${String(i+1).padStart(2,"0")}`;const L=yearData.filter(x=>x.mes===mk);
    const g=sum(L.filter(x=>GASTO_BLOCOS.includes(x.bloco))),e=sum(L.filter(x=>x.bloco==="entrada")),iv=sum(L.filter(x=>x.bloco==="invest"));
    return {n,mk,g,e,iv,d:e-g}});
}
function renderYear(){
  if(!yearData){$("#main").innerHTML='<div class="status">Carregando o ano…</div>';return}
  const rows=yearSummary();
  const max=Math.max(1,...rows.map(r=>Math.max(r.g,r.e)));
  const T=rows.reduce((a,r)=>({g:a.g+r.g,e:a.e+r.e,iv:a.iv+r.iv}),{g:0,e:0,iv:0});
  const all=yearData.filter(x=>GASTO_BLOCOS.includes(x.bloco));
  const cats=CATS.map(c=>({c,v:sum(all.filter(x=>x.categoria===c))})).filter(x=>x.v).sort((a,b)=>b.v-a.v);
  $("#main").innerHTML=`
  <div class="stats">
    <div class="stat"><span>Entradas no ano</span><b>${brl(T.e)}</b></div>
    <div class="stat"><span>Gastos no ano</span><b>${brl(T.g)}</b></div>
    <div class="stat ${T.e-T.g<0?"neg":"pos"}"><span>Diferença</span><b>${brl(T.e-T.g)}</b></div>
    <div class="stat"><span>Investido</span><b>${brl(T.iv)}</b></div>
  </div>
  <section class="card"><header><h2>Panorama anual</h2></header><div class="body">
    <div class="yearbars">${rows.map(r=>`<div class="yb" title="${r.n}: gastos ${brl(r.g)} · entradas ${brl(r.e)}"><div class="cols"><i class="e" style="height:${r.e/max*100}%"></i><i class="g" style="height:${r.g/max*100}%"></i></div><small>${r.n.slice(0,3)}</small></div>`).join("")}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Entradas</span><span><i style="background:var(--red)"></i>Gastos</span></div>
    <div class="tw"><table><tr><th>Mês</th><th>Gastos</th><th>Entradas</th><th>Saldo</th></tr>
    ${rows.map(r=>`<tr data-mk="${r.mk}" style="cursor:pointer"><td>${r.n.slice(0,3)}</td><td>${brl(r.g)}</td><td>${brl(r.e)}</td><td class="${r.d<0?"over":""}">${brl(r.d)}</td></tr>`).join("")}
    </table></div></div></section>
  <section class="card"><header><h2>Gastos do ano por categoria</h2></header><div class="body">
    <table><tr><th>Categoria</th><th>Total</th><th>%</th></tr>
    ${cats.map(x=>`<tr><td>${esc(x.c)}<div class="bar"><i style="width:${x.v/(cats[0]?.v||1)*100}%"></i></div></td><td>${brl(x.v)}</td><td>${pct(T.g?x.v/T.g:0)}</td></tr>`).join("")||'<tr><td colspan="3" class="empty">Sem gastos neste ano.</td></tr>'}
    </table></div></section>
  ${modoLocal?`<section class="card"><header><h2>Backup</h2></header><div class="body" style="padding:12px 14px">
    <p style="margin:0 0 10px;color:var(--muted);font-size:13px">Seus dados ficam salvos só neste aparelho. Baixe um backup de vez em quando. Último backup: <b>${esc(lsGet("minhas-financas-ultimo-backup","nunca"))}</b>.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bkDown">⬇ Baixar backup</button><button class="btn" id="bkUp">⬆ Restaurar backup</button></div>
    <input id="bkFile" type="file" accept="application/json,.json" style="display:none"></div></section>`:""}`;
  if(modoLocal){$("#bkDown").onclick=baixarBackup;$("#bkUp").onclick=()=>$("#bkFile").click();$("#bkFile").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)restaurarBackup(f)}}
  document.querySelectorAll("tr[data-mk]").forEach(tr=>tr.onclick=()=>{cur=tr.dataset.mk;document.querySelector('.seg button[data-view="mes"]').click();subscribe()});
}

</script>
</body>
</html>
